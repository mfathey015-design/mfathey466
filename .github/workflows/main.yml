name: Hosting Bot 24/7 - Ultra Stable

on:
  push:
    branches: [ main, master, رئيسي ]
  schedule:
    - cron: '*/15 * * * *'   # كل 15 دقيقة (الحد الأدنى الموثوق في GitHub)
  workflow_dispatch:
  repository_dispatch:
    types: [keep-alive]

concurrency:
  group: bot-running
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 🔍 Debug - Show Files & Branch
        run: |
          echo "📍 Branch : ${{ github.ref }}"
          echo "📍 Commit : ${{ github.sha }}"
          echo "📂 PWD    : $(pwd)"
          echo "----- Root files -----"
          ls -la
          echo "----- Searching for main.py -----"
          find . -name "main.py" -not -path "./.git/*" || echo "❌ main.py NOT FOUND"
          echo "----- Python version -----"
          python --version

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir flask python-telegram-bot psutil requests aiohttp pyTelegramBotAPI telethon
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -r requirements.txt
          fi

      - name: 🚀 Run Bot with Auto-Restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: 8080
          PYTHONUNBUFFERED: 1
        run: |
          # تأكد أن الملف موجود قبل التشغيل
          if [ ! -f main.py ]; then
            echo "❌ main.py غير موجود! توقف."
            exit 1
          fi

          while true; do
            echo "🚀 Starting bot at $(date)"
            python main.py &
            BOT_PID=$!

            COUNTER=0
            while kill -0 $BOT_PID 2>/dev/null; do
              sleep 10
              COUNTER=$((COUNTER + 1))
              if [ $((COUNTER % 30)) -eq 0 ]; then
                echo "💓 Bot is alive - $COUNTER cycles"
              fi
            done

            wait $BOT_PID
            EXIT_CODE=$?
            echo "⚠️ Bot stopped at $(date) with exit code: $EXIT_CODE"
            echo "🔄 Restarting in 5 seconds..."
            sleep 5
          done

      - name: 💾 Auto-Sync Data
        if: always()
        run: |
          for i in {1..5}; do
            echo "🔄 Sync attempt $i/5"
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            mkdir -p hosted_projects
            git add hosted_projects/ || true

            if git diff --cached --quiet; then
              echo "ℹ️ No changes to commit"
              break
            fi

            git commit -m "Auto-sync $(date +'%Y-%m-%d %H:%M:%S')" || true

            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "✅ Push successful"
              break
            else
              echo "⚠️ Push failed, retrying..."
              sleep 3
              git pull --rebase origin ${GITHUB_REF_NAME} || true
            fi
            sleep 2
          done

      - name: 🔄 Keep-Alive Signal
        if: always()
        run: echo "🔄 Keep-alive at $(date)"

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf /tmp/*.lock || true
          rm -rf /tmp/*.pid || true
          echo "🧹 Cleanup completed"
